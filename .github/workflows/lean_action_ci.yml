name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Audit every library module and repository sources
        run: python3 scripts/audit_repository.py --build --output /tmp/repository-audit.json
      - name: Validate open research ledgers
        run: |
          python3 -m unittest discover -s scripts -p 'test_repository_audit.py'
          python3 scripts/check_yang_mills_requirements.py
          python3 scripts/validate_toe_attack_ledger.py
      - name: Check current twisted-program axiom dependencies
        run: python3 scripts/check_twisted_axioms.py
      - name: Inspect transitive axioms of the complete library
        run: python3 scripts/check_repository_axioms.py --output /tmp/repository-axioms.json
      - uses: leanprover-community/docgen-action@v1
